<!DOCTYPE html>
<html>
<head>
    <title>WASM C Library Example</title>
</head>
<body>
    <h1>WebAssembly C Library Demo</h1>
    <input type="text" id="inputText" placeholder="Enter text..." value="Hello World">
    <button id="processBtn">Process</button>
    <button id="reverseBtn">Reverse</button>
    <div id="output"></div>

    <script type="module">
        import init from './mylib.js';
        
        let wasmModule = null;
        
        // Initialize WebAssembly
        async function initializeWasm() {
            try {
                wasmModule = await init();
                console.log('WASM module loaded successfully');
                
                // Enable buttons after WASM is loaded
                document.getElementById('processBtn').disabled = false;
                document.getElementById('reverseBtn').disabled = false;
                
            } catch (error) {
                console.error('Failed to load WASM module:', error);
            }
        }
        
        // Process string using ccall
        function processWithWasm() {
            if (!wasmModule) {
                console.error('WASM module not loaded');
                return;
            }
            
            const input = document.getElementById('inputText').value;
            
            const resultPtr = wasmModule.ccall(
                'process_string',
                'number',
                ['string'],
                [input]
            );
            
            const result = wasmModule.UTF8ToString(resultPtr);
            wasmModule.ccall('free_string', null, ['number'], [resultPtr]);
            
            document.getElementById('output').innerHTML = 
                `Result: ${result}`;
        }
        
        // Alternative: Using cwrap
        function reverseWithWasm() {
            if (!wasmModule) {
                console.error('WASM module not loaded');
                return;
            }
            
            const input = document.getElementById('inputText').value;
            
            const reverseString = wasmModule.cwrap(
                'reverse_string',
                'number',
                ['string']
            );
            
            const resultPtr = reverseString(input);
            const result = wasmModule.UTF8ToString(resultPtr);
            wasmModule._free(resultPtr);
            
            document.getElementById('output').innerHTML = 
                `Reversed: ${result}`;
        }
        
        // Initialize when page loads
        initializeWasm();
        
        // Add event listeners inside the module
        document.getElementById('processBtn').addEventListener('click', processWithWasm);
        document.getElementById('reverseBtn').addEventListener('click', reverseWithWasm);
        
        // Initially disable buttons
        document.getElementById('processBtn').disabled = true;
        document.getElementById('reverseBtn').disabled = true;
    </script>
</body>
</html>
